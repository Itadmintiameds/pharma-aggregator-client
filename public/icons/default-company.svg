<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Company">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE4FF"/>
      <stop offset="1" stop-color="#C4AAFD"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" fill="url(#bg)"/>
  <!-- ground -->
  <rect x="22" y="124" width="116" height="6" rx="3" fill="#4C1D95" opacity="0.25"/>
  <!-- side building -->
  <rect x="26" y="78" width="34" height="46" rx="3" fill="#9F75FC"/>
  <g fill="#EDE4FF">
    <rect x="32" y="86" width="8" height="8" rx="1.5"/><rect x="46" y="86" width="8" height="8" rx="1.5"/>
    <rect x="32" y="102" width="8" height="8" rx="1.5"/><rect x="46" y="102" width="8" height="8" rx="1.5"/>
  </g>
  <!-- main tower -->
  <rect x="58" y="34" width="52" height="90" rx="4" fill="url(#tower)"/>
  <g fill="#EDE4FF">
    <rect x="66" y="44" width="10" height="10" rx="1.5"/><rect x="92" y="44" width="10" height="10" rx="1.5"/>
    <rect x="66" y="62" width="10" height="10" rx="1.5"/><rect x="92" y="62" width="10" height="10" rx="1.5"/>
    <rect x="66" y="80" width="10" height="10" rx="1.5"/><rect x="92" y="80" width="10" height="10" rx="1.5"/>
  </g>
  <rect x="76" y="100" width="16" height="24" rx="2" fill="#EDE4FF"/>
  <!-- right building -->
  <rect x="106" y="64" width="30" height="60" rx="3" fill="#9F75FC"/>
  <g fill="#EDE4FF">
    <rect x="112" y="72" width="7" height="8" rx="1.5"/><rect x="124" y="72" width="7" height="8" rx="1.5"/>
    <rect x="112" y="88" width="7" height="8" rx="1.5"/><rect x="124" y="88" width="7" height="8" rx="1.5"/>
    <rect x="112" y="104" width="7" height="8" rx="1.5"/><rect x="124" y="104" width="7" height="8" rx="1.5"/>
  </g>
</svg>
